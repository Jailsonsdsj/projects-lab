# Every push to main (playbook §9): the same checks, then remote migrations,
# deploy and a health check. The Cloudflare secrets are set only on the steps
# that need them, never job-wide, and every wrangler call names --env=""
# (the top-level Worker), so an env added to wrangler.jsonc later can't
# change what deploys.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @projects-lab/web build
      - run: pnpm test

      - name: Migrate the remote D1
        run: pnpm --filter @projects-lab/api exec wrangler d1 migrations apply projects-lab --remote --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker
        run: pnpm --filter @projects-lab/api exec wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Health check
        run: curl -fsS --retry 5 --retry-delay 3 https://projects-lab.jailson-junior36.workers.dev/api/health
